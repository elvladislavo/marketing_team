<link rel="stylesheet" href="brand.css"><style>
html,body{height:1920px}.slide{padding:150px 88px}
.l{opacity:0}
h1{font-size:120px}
.hook{margin-top:90px}
.rows{margin-top:60px;display:flex;flex-direction:column}
.r{display:flex;justify-content:space-between;align-items:center;border-top:3px solid rgba(239,234,225,.25);padding:30px 0;opacity:0}
.r b{font-weight:800;font-size:74px;letter-spacing:-.03em}
.r small{display:block;font:500 28px ui-monospace,monospace;color:var(--bone2);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.pr{font-weight:800;font-size:74px;color:var(--lime);white-space:nowrap;letter-spacing:-.02em}
.pr i{font-style:normal;font-size:40px;color:var(--bone2);font-weight:500;margin-right:14px}
.note{position:absolute;left:88px;right:88px;bottom:150px;border:4px solid var(--red);border-radius:12px;padding:40px 44px;font:800 68px/1.05 "Archivo Variable";letter-spacing:-.03em;opacity:0}
.note em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:var(--red)}
.end{position:absolute;inset:0;background:var(--red);display:flex;flex-direction:column;justify-content:center;padding:88px;opacity:0}
.end h2{font:800 150px/1 "Archivo Variable";letter-spacing:-.04em;color:#fff}
.end h2 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
.end .pill{margin-top:80px;background:var(--ink);color:var(--bone);font:800 76px "Archivo Variable";padding:36px 48px;border-radius:12px;display:inline-block;align-self:flex-start}
.end .u{margin-top:50px;font:600 46px ui-monospace,monospace;color:#fff}
</style>
<div class="slide"><div class="top"><span class="logo">el</span><span>Warszawa</span></div>
<div class="hook"><div class="bar l" id="b"></div>
<h1><span class="l" id="h1" style="display:block">Ile naprawdę</span><span class="l" id="h2" style="display:block">kosztuje <em>strona?</em></span></h1></div>
<div class="rows">
 <div class="r" id="r1"><div><b>Redesign</b><small>treści zostają</small></div><span class="pr"><i>od</i>500 zł</span></div>
 <div class="r" id="r2"><div><b>Landing</b><small>jedna oferta</small></div><span class="pr"><i>od</i>800 zł</span></div>
 <div class="r" id="r3"><div><b>Firma</b><small>kilka podstron</small></div><span class="pr"><i>od</i>1500 zł</span></div>
 <div class="r" id="r4"><div><b>Autorska</b><small>własny układ</small></div><span class="pr"><i>od</i>2000 zł</span></div>
 <div class="r" id="r5"><div><b>WooCommerce</b><small>sklep</small></div><span class="pr"><i>od</i>3200 zł</span></div>
</div>
<div class="note" id="note">Hosting i domena <em>osobno.</em></div></div>
<div class="end" id="end"><h2>Napisz<br>w <em>DM</em> →</h2><div class="pill">wycena po rozmowie</div><div class="u">@elvladislavo_com<br>elvladislavo.com</div></div>
<script>
const C=x=>Math.min(Math.max(x,0),1),ease=x=>1-Math.pow(1-C(x),3);
const show=(id,t0,t,d=0.5,dy=40)=>{const e=document.getElementById(id),k=ease((t-t0)/d);e.style.opacity=k;e.style.transform=`translateY(${dy*(1-k)}px)`;return k};
window.render=t=>{
 show('b',0,t,.25,0);show('h1',0,t,.35,50);show('h2',.2,t,.35,50);
 [1.6,3.0,4.4,5.8,7.2].forEach((s,i)=>show('r'+(i+1),s,t,.5,50));
 const n=document.getElementById('note'),k=ease((t-8.9)/.45);n.style.opacity=k;n.style.transform=`scale(${.92+.08*k})`;
 const e=document.getElementById('end');e.style.opacity=ease((t-11.0)/.35);
 const eh=e.querySelector('h2'),ep=e.querySelector('.pill');eh.style.transform=`translateY(${40*(1-ease((t-11.1)/.5))}px)`;ep.style.opacity=ease((t-11.7)/.4);
};
render(0);
</script>
