<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent!important;margin:0}
#shade{position:absolute;inset:0;background:linear-gradient(rgba(10,10,11,.85) 0,rgba(10,10,11,.4) 300px,transparent 440px,transparent 1400px,rgba(10,10,11,.85) 1580px)}
.topbar{position:absolute;left:88px;right:88px;top:110px;display:flex;justify-content:space-between;align-items:center;font:700 46px ui-monospace,monospace;letter-spacing:.14em;color:rgba(255,255,255,.85)}
.pxlogo{position:relative;display:block;width:132px;height:84px}.pxlogo i{position:absolute;width:12px;height:12px;background:#FF2E1F}
#hook{position:absolute;left:60px;right:60px;top:228px;text-align:center;font:800 66px/1.05 "Archivo Variable";color:#fff;letter-spacing:-.03em;text-shadow:0 2px 18px rgba(0,0,0,.5)}
#hook em,.serif{font-family:"Instrument Serif";font-weight:400;font-style:italic;color:#FF2E1F}#hook em{font-size:1.25em;line-height:.8}
#sub{position:absolute;left:70px;right:70px;top:1580px;text-align:center;font:800 68px/1.1 "Archivo Variable";color:#fff;letter-spacing:-.03em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
#sub .w{display:inline-block;margin:0 .12em}#sub .w.on{color:#FF2E1F}
#fx{position:absolute;inset:0}
.tagr{position:absolute;background:#FF2E1F;color:#fff;font:800 44px/1 "Archivo Variable";padding:16px 24px;border-radius:10px;white-space:nowrap}
#cta{position:absolute;left:50%;top:1380px;background:#FF2E1F;color:#fff;font:800 54px "Archivo Variable";padding:26px 44px;border-radius:999px;opacity:0;white-space:nowrap}
</style>
<div id="shade"></div><div id="fx"></div>
<div class="topbar"><span id="px" class="pxlogo"></span><span>WARSZAWA</span></div>
<div id="hook"></div><div id="sub"></div><div id="cta">Napisz w DM →</div>
<script>
const $=id=>document.getElementById(id), C=x=>Math.min(Math.max(x,0),1), oC=x=>1-Math.pow(1-C(x),3);
const oB=x=>{x=C(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
(()=>{const E=['.....','.###.','#...#','#####','#....','#...#','.###.'],L=['##.','.#.','.#.','.#.','.#.','.#.','###'];let h='';
E.forEach((r,y)=>[...r].forEach((c,x)=>{if(c=='#')h+=`<i style="left:${x*12}px;top:${y*12}px"></i>`}));
L.forEach((r,y)=>[...r].forEach((c,x)=>{if(c=='#')h+=`<i style="left:${(x+6)*12}px;top:${y*12}px"></i>`}));
$('px').innerHTML=h;})();
// parry_edit.mp4: impacts ~0.25, 1.5, 2.25, 4.5, 5.75 s
const HITS=[[.05,.3,'BŁĄD 404',140,620],[1.15,1.55,'WOLNA STRONA',560,700],[1.95,2.3,'SPAM',600,560],[4.1,4.5,'BRAK HTTPS',120,760],[5.4,5.8,'ZEPSUTY FORMULARZ',300,620]];
const S={hook:'Odbijam <em>problemy</em> Twojej strony',total:6.85,cta:5.9,
lines:[[.1,1.3,'Problemy ze stroną?'],[2.6,4.0,'Odbijam je po kolei.'],[4.6,5.8,'A Ty robisz swoje.']],
setup(){ $('fx').innerHTML=HITS.map(([a,h,txt,x,y],i)=>`<div id="h${i}" class="tagr" style="left:${x}px;top:${y}px">${txt}</div><div id="k${i}" class="tagr" style="left:${x}px;top:${y+80}px;background:#fff;color:#0A0A0B;font-size:34px">ODBITE ✓</div>`).join('');},
update(t){ HITS.forEach(([a,h],i)=>{const e=$('h'+i),k=$('k'+i);
 if(t<a||t>h+.9){e.style.opacity=0;k.style.opacity=0;return}
 const hit=t>=h; e.style.opacity=hit?1-C((t-h-.5)/.4):C((t-a)/.12); e.style.transform=hit?`rotate(${-8+Math.sin(i)*6}deg) scale(${1-.15*C((t-h)/.2)})`:`scale(${.6+.4*oB((t-a)/.25)})`;
 e.style.textDecoration=hit?'line-through':'none'; e.style.textDecorationThickness='6px';
 k.style.opacity=hit?C((t-h)/.1)*(1-C((t-h-.5)/.4)):0; k.style.transform=`scale(${hit?.5+.5*oB((t-h)/.25):.5})`;});}};

// subtitles with explicit [t0,t1,text]: words revealed evenly across the span
const words=[];S.lines.forEach(([a,b,txt],li)=>{const ws=txt.split(' '),d=(b-a)/ws.length;ws.forEach((w,i)=>words.push({li,w,t:a+i*d,end:a+(i+1)*d}))});
$('hook').innerHTML=S.hook||'';if(S.setup)S.setup();
window.TOTAL=S.total;
window.render=t=>{let cur=-1;S.lines.forEach(([a,b],i)=>{if(t>=a-.05&&t<b+.4)cur=i});
 $('sub').innerHTML=cur<0?'':words.filter(x=>x.li===cur).map(x=>{const k=oC((t-x.t+.05)/.15),on=t>=x.t&&t<x.end;return `<span class="w${on?' on':''}" style="opacity:${k};transform:translateY(${26*(1-k)}px)">${x.w}</span>`}).join(' ');
 if(S.cta!=null){const k=(t-S.cta)/.35;$('cta').style.opacity=C(k*3);$('cta').style.transform=`translateX(-50%) scale(${t<S.cta?.4:.4+.6*oB(k)})`;}
 if(S.update)S.update(t);};
render(0);
</script>
