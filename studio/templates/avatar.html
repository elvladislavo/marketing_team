<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="brand.css">
<style>
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--ink)}
.wrap{position:absolute;inset:0;display:flex;gap:0}
.cell{position:relative;width:360px;height:1350px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cap{font:600 26px ui-monospace,monospace;color:var(--bone2);margin-top:20px;letter-spacing:.08em}
</style>
<div class="wrap">
 <div class="cell" style="background:#EFEAE1"><svg id="a1" width="340" height="460" viewBox="0 0 400 540"></svg><div class="cap" style="color:#0A0A0B">A · PAPER</div></div>
 <div class="cell" style="background:#0A0A0B"><svg id="a2" width="340" height="460" viewBox="0 0 400 540"></svg><div class="cap">B · INK</div></div>
 <div class="cell" style="background:#FF2E1F"><svg id="a3" width="340" height="460" viewBox="0 0 400 540"></svg><div class="cap" style="color:#0A0A0B">C · TALK</div></div>
</div>
<script>
// Original flat "paper cut-out" avatar of Uladzislau. mouth: 'grin' | 'talk' | 'neutral'
function avatar(mouth, look){
 const H='#2E1E14', H2='#4A3121', SK='#F1C7A6', SK2='#E3AE8B', BE='#6E4C34', SH='#E8441E';
 // curls: circles along hair silhouette (big top volume + mullet down to shoulders)
 let curls='';const pts=[[120,120,46],[170,92,50],[230,90,50],[282,112,46],[318,150,40],[90,165,42],[70,215,38],[330,200,38],[62,270,36],[338,255,34],[66,325,36],[334,305,32],[78,380,36],[322,355,30],[95,430,34],[300,400,28],[120,470,30],[200,70,40],[145,150,40],[255,140,40]];
 pts.forEach(([x,y,r],i)=>{curls+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${i%3?H:H2}"/>`});
 // little curl strokes on top
 let swirls='';[[150,95],[205,78],[260,98],[110,160],[300,170],[80,300],[320,280],[90,410]].forEach(([x,y])=>{swirls+=`<path d="M${x-12},${y} q12,-16 24,0 q-12,14 -6,-4" fill="none" stroke="#120A05" stroke-width="5" stroke-linecap="round" opacity=".55"/>`});
 const m = mouth==='talk' ? `<ellipse cx="200" cy="365" rx="34" ry="24" fill="#5A1A14"/><rect x="172" y="345" width="56" height="12" rx="4" fill="#fff"/><ellipse cx="200" cy="378" rx="18" ry="7" fill="#E07A6F"/>`
   : mouth==='neutral' ? `<path d="M168,362 q32,12 64,0" stroke="#5A1A14" stroke-width="7" fill="none" stroke-linecap="round"/>`
   : `<path d="M150,345 q50,58 100,0 z" fill="#fff" stroke="#5A1A14" stroke-width="6" stroke-linejoin="round"/><path d="M152,352 h96" stroke="#ddd" stroke-width="3"/><path d="M162,368 q38,20 76,0" fill="none" stroke="#E07A6F" stroke-width="6" stroke-linecap="round"/>`;
 const dx = look||0;
 return `
 <defs><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#000" flood-opacity=".25"/></filter></defs>
 <g filter="url(#sh)">
  <!-- shirt -->
  <path d="M40,540 q10,-90 90,-110 l70,40 l70,-40 q80,20 90,110 z" fill="${SH}"/>
  <path d="M150,432 l50,48 l50,-48" fill="none" stroke="#B8300F" stroke-width="7" stroke-linejoin="round"/>
  <rect x="165" y="380" width="70" height="70" fill="${SK2}"/>
  <!-- back hair -->
  ${curls}
  <!-- ears -->
  <ellipse cx="96" cy="255" rx="20" ry="28" fill="${SK2}"/><ellipse cx="304" cy="255" rx="20" ry="28" fill="${SK2}"/>
  <!-- face -->
  <ellipse cx="200" cy="255" rx="108" ry="128" fill="${SK}"/>
  <!-- beard -->
  <path d="M96,270 q4,150 104,158 q100,-8 104,-158 q-20,60 -40,74 q-64,-26 -128,0 q-24,-14 -40,-74 z" fill="${BE}"/>
  <path d="M136,336 q64,-36 128,0 q-18,10 -30,6 q-34,-16 -68,0 q-12,4 -30,-6 z" fill="#5C3E2A"/>
  ${m}
  <!-- nose -->
  <path d="M200,232 q-20,52 -16,70 q16,10 32,0 q4,-18 -16,-70" fill="${SK2}"/>
  <!-- eyes -->
  <ellipse cx="158" cy="238" rx="22" ry="14" fill="#fff"/><ellipse cx="242" cy="238" rx="22" ry="14" fill="#fff"/>
  <circle cx="${160+dx}" cy="239" r="8" fill="#6F8A6A"/><circle cx="${244+dx}" cy="239" r="8" fill="#6F8A6A"/>
  <circle cx="${160+dx}" cy="239" r="4" fill="#111"/><circle cx="${244+dx}" cy="239" r="4" fill="#111"/>
  <!-- brows -->
  <path d="M128,210 q30,-16 58,-4" stroke="${H}" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M214,206 q28,-12 58,4" stroke="${H}" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- fringe curls over forehead -->
  <circle cx="130" cy="150" r="34" fill="${H}"/><circle cx="175" cy="140" r="32" fill="${H2}"/><circle cx="222" cy="142" r="32" fill="${H}"/><circle cx="268" cy="152" r="32" fill="${H2}"/><circle cx="110" cy="190" r="22" fill="${H}"/><circle cx="292" cy="188" r="22" fill="${H}"/>
  ${swirls}
 </g>`}
document.getElementById('a1').innerHTML=avatar('grin');
document.getElementById('a2').innerHTML=avatar('neutral',3);
document.getElementById('a3').innerHTML=avatar('talk');
window.avatar=avatar;
</script>
