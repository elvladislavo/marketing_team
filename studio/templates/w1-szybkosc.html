<link rel="stylesheet" href="brand.css"><style>
html,body{height:1920px}.slide{padding:150px 88px}
.l{opacity:0}
h1{font-size:128px}
.hook{margin-top:160px}
.items{margin-top:120px;display:flex;flex-direction:column;gap:60px}
.it{display:flex;align-items:center;gap:36px;opacity:0;border-top:3px solid #2a2a2e;padding-top:36px}
.n{font:800 120px/1 "Archivo Variable";color:var(--red);width:170px}
.lab{font-weight:800;font-size:68px;line-height:1.05;letter-spacing:-.03em;flex:1}
.lab small{display:block;font:500 30px ui-monospace,monospace;color:var(--bone2);letter-spacing:.06em;margin-top:10px;text-transform:uppercase}
.vis{width:230px;height:160px;position:relative}
.box{width:230px;height:160px;border:4px solid var(--bone);border-radius:10px;position:relative;overflow:hidden}
.bar2{position:absolute;left:0;bottom:0;height:22px;background:var(--red)}
.plug{position:absolute;width:44px;height:44px;border-radius:8px;background:var(--lime)}
.end{position:absolute;inset:0;background:var(--red);display:flex;flex-direction:column;justify-content:center;padding:88px;opacity:0}
.end h2{font:800 140px/1 "Archivo Variable";letter-spacing:-.04em;color:#fff}
.end h2 em{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400}
.end .pill{margin-top:80px;background:var(--ink);color:var(--bone);font:800 70px "Archivo Variable";padding:36px 48px;border-radius:12px;display:inline-block;align-self:flex-start}
.end .u{margin-top:50px;font:600 46px ui-monospace,monospace;color:#fff}
</style>
<div class="slide"><div class="top"><span class="logo">el</span><span>Warszawa</span></div>
<div class="hook"><div class="bar l" id="b"></div>
<h1><span class="l" id="h1" style="display:block">3 rzeczy, które</span><span class="l" id="h2" style="display:block"><em>spowalniają</em></span><span class="l" id="h3" style="display:block">Twoją stronę.</span></h1></div>
<div class="items">
 <div class="it" id="i1"><div class="n">1</div><div class="lab">Ciężkie zdjęcia<small>nieskompresowane</small></div>
  <div class="vis"><div class="box"><div class="bar2" id="p1" style="width:0;background:var(--red)"></div><div id="t1" style="position:absolute;left:16px;top:14px;font:800 34px 'Archivo Variable'">ZA DUŻE</div></div></div></div>
 <div class="it" id="i2"><div class="n">2</div><div class="lab">Za dużo wtyczek<small>każda coś dokłada</small></div>
  <div class="vis"><div class="box" id="pl"></div></div></div>
 <div class="it" id="i3"><div class="n">3</div><div class="lab">Brak lazy loading<small>wszystko naraz</small></div>
  <div class="vis"><div class="box"><div id="lz"></div></div></div></div>
</div></div>
<div class="end" id="end"><h2>Szybka strona?<br><em>Napisz w DM</em> →</h2><div class="pill">od 800 zł</div><div class="u">@elvladislavo_com<br>elvladislavo.com</div></div>
<script>
const C=x=>Math.min(Math.max(x,0),1),ease=x=>1-Math.pow(1-C(x),3);
const show=(id,t0,t,d=0.5,dy=40)=>{const e=document.getElementById(id),k=ease((t-t0)/d);e.style.opacity=k;e.style.transform=`translateY(${dy*(1-k)}px)`};
// plugins grid
const pl=document.getElementById('pl');for(let i=0;i<6;i++){const d=document.createElement('div');d.className='plug';d.style.left=(14+(i%3)*72)+'px';d.style.top=(18+Math.floor(i/3)*72)+'px';d.style.opacity=0;pl.appendChild(d)}
const lz=document.getElementById('lz');for(let i=0;i<4;i++){const d=document.createElement('div');d.style.cssText=`position:absolute;left:${14+(i%2)*104}px;top:${14+Math.floor(i/2)*70}px;width:92px;height:58px;background:var(--bone2);opacity:0`;lz.appendChild(d)}
window.render=t=>{
 show('b',0,t,.3,0);show('h1',0,t,.4,50);show('h2',.2,t,.4,50);show('h3',.4,t,.4,50);
 show('i1',1.8,t);show('i2',4.2,t);show('i3',6.6,t);
 document.getElementById('p1').style.width=(230*ease((t-2.2)/1.6))+'px';
 [...pl.children].forEach((d,i)=>{const k=ease((t-4.6-i*.25)/.3);d.style.opacity=k;d.style.transform=`scale(${.5+.5*k})`});
 [...lz.children].forEach((d,i)=>{const k=ease((t-7.0-i*.15)/.2);d.style.opacity=k});
 const e=document.getElementById('end');e.style.opacity=ease((t-9.2)/.35);
 e.querySelector('h2').style.transform=`translateY(${40*(1-ease((t-9.3)/.5))}px)`;e.querySelector('.pill').style.opacity=ease((t-9.9)/.4);
};
render(0);
</script>
